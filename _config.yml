title: "Infralicious"
description: "Small, honest software for teams. TrueTime for Jira: Forge-native timesheets."
url: "https://infralicious.com"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "default"

plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed

# Jekyll skips dot-directories by default. Include .well-known
# so the security.txt file below ships to the live site.
include:
  - .well-known

# AGENTS.md and CLAUDE.md stay in the repo for agents.
# They are not site pages for end users.
# Exclude them from the build, the sitemap, and search.
# Keep the Jekyll default excludes too, so an explicit
# list does not undo them on GitHub Pages Jekyll 3.
exclude:
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

breadcrumbs: true
search: true
# Minimal Mistakes Lunr search covers posts only by default.
# Pages were missing from results, so a search for "beta"
# returned only the beta post, not the beta page or docs.
search_full_content: true
lunr:
  search_within_pages: true
atom_feed:
  hide: false
locale: "en"

author:
  name: "Infralicious"

footer:
  links:
    - label: "Contact"
      url: "/contact.html"
    - label: "About"
      url: "/about.html"
    - label: "Careers"
      url: "/careers.html"
    - label: "Privacy Policy"
      url: "/privacy.html"
    - label: "Terms of Service"
      url: "/terms.html"
    - label: "Support SLA"
      url: "/sla.html"
    - label: "Changelog"
      url: "/changelog.html"
    - label: "Blog"
      url: "/blog/"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: false
      toc: true
      toc_sticky: true
  # Second mechanism for agent docs, in addition to exclude above.
  # Exclude alone did not remove AGENTS.html and CLAUDE.html live.
  # These path-specific defaults are more specific than pages defaults.
  # They set sitemap and search flags to false for these files only.
  # SECURITY.md is not listed here. It is public policy. Keep it.
  - scope:
      path: "AGENTS.md"
    values:
      sitemap: false
      search: false
  - scope:
      path: "CLAUDE.md"
    values:
      sitemap: false
      search: false
