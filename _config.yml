title: "Infralicious"
description: "Small, honest software for teams. TrueTime for Jira: Forge-native timesheets."
url: "https://infralicious.github.io"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "default"

plugins:
  - jekyll-include-cache

breadcrumbs: true
locale: "en"

author:
  name: "Infralicious"
  email: "***REMOVED***"

footer:
  links:
    - label: "About"
      url: "/about.html"
    - label: "Careers"
      url: "/careers.html"
    - label: "Privacy Policy"
      url: "/privacy.html"
    - label: "Terms of Service"
      url: "/terms.html"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: false
      toc: true
      toc_sticky: true
