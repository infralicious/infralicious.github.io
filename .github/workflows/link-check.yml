name: Check links

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  htmlproofer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
      - name: Check links
        run: bundle exec htmlproofer ./_site --disable-external --allow-hash-href
