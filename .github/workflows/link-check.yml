name: Check links

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  htmlproofer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
      - name: Check links
        run: bundle exec htmlproofer ./_site --disable-external --allow-hash-href
