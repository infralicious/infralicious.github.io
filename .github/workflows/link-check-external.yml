name: Check external links

# Weekly check only. This workflow never blocks a push.
# External sites can fail for reasons outside this repo.
# The push link check stays internal-only and stays green.

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  htmlproofer-external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
      - name: Check external links
        continue-on-error: true
        run: bundle exec htmlproofer ./_site --allow-hash-href
